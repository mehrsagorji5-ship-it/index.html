<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>For Luna ♥</title><style>* {  box-sizing: border-box;}body {  margin: 0;  min-height: 100vh;  display: flex;  justify-content: center;  align-items: center;  background: radial-gradient(circle, #19213f, #050611 75%);  overflow: hidden;  font-family: Arial, sans-serif;}.heart {  position: relative;  width: min(90vw, 380px);  aspect-ratio: 1;  animation: beat 1.5s infinite ease-in-out;  filter: drop-shadow(0 0 20px #ff4f91);}svg {  width: 100%;  height: 100%;  overflow: visible;}#words {  font-size: 10px;  font-weight: bold;  fill: #fff0f6;  text-anchor: middle;}h1 {  position: absolute;  bottom: -35px;  width: 100%;  text-align: center;  color: #ff8bb8;  font-size: 18px;  letter-spacing: 3px;}@keyframes beat {  0%, 100% { transform: scale(0.96); }  50% { transform: scale(1.04); }}</style></head><body><div class="heart">  <svg viewBox="0 0 400 360">    <defs>      <clipPath id="heartShape">        <path d="M200 330          C170 300 25 205 25 110          C25 10 145 0 200 85          C255 0 375 10 375 110          C375 205 230 300 200 330 Z"/>      </clipPath>    </defs>    <path d="M200 330      C170 300 25 205 25 110      C25 10 145 0 200 85      C255 0 375 10 375 110      C375 205 230 300 200 330 Z"      fill="#ff3f85"/>    <g id="words" clip-path="url(#heartShape)"></g>  </svg>  <h1>FOR MY LUNA ♥</h1></div><script>const words = document.getElementById("words");for (let y = 35; y < 300; y += 17) {  for (let x = 35; x < 370; x += 57) {    const word = document.createElementNS(      "http://www.w3.org/2000/svg",      "text"    );    word.setAttribute("x", x);    word.setAttribute("y", y);    word.textContent = "I LOVE YOU";    words.appendChild(word);  }}</script></body></html>
